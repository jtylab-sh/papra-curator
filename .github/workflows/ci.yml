name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Runs with no dependencies installed, exactly as the image does.
      - name: Test
        run: node --test 'src/*.test.ts'
      # tsc and @types/node are dev-only: the service has no runtime
      # dependencies and is never built.
      - name: Install dev tooling
        run: npm ci
      - name: Type-check
        run: npm run typecheck

  release:
    # Every push to main releases the next version. The bump is read from the
    # conventional-commit subjects since the last tag: `type!:` or a
    # `BREAKING CHANGE:` footer is major, `feat:` is minor, anything else patch.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # To create the tag and the GitHub release.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump is computed from history, so a shallow clone will not do.
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            range="$last..HEAD"
            base="${last#v}"
          else
            range=""
            base="0.0.0"
          fi
          subjects=$(git log --format='%s' ${range:+$range})
          bodies=$(git log --format='%b' ${range:+$range})
          # A re-run of an already-released commit must not invent a version.
          if [ -z "$subjects" ]; then
            echo "HEAD is already released as $last; nothing to release."
            exit 0
          fi
          if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
            bump=minor
          else
            bump=patch
          fi
          IFS=. read -r major minor patch <<<"$base"
          patch=${patch:-0}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "$bump bump: $base -> $version"
          # Creates the tag as well as the release, from this exact commit.
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          {
            echo "version=$version"
            echo "minor=$major.$minor"
          } >> "$GITHUB_OUTPUT"

  image:
    # A tag pushed by GITHUB_TOKEN does not start a new workflow run, so the
    # image is built here from the version `release` just computed, not from a
    # tag trigger. Empty means there was nothing to release.
    if: needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The built-in GITHUB_TOKEN can push to GHCR with this; no PAT needed.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.minor }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
